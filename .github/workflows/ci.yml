name: CI

# Every stage is tools/ci/check.sh, run in Fedora 44 (Zynith's platform). Run the same checks locally with
# tools/ci/local.sh.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    strategy:
      fail-fast: false
      matrix:
        stage: [hygiene, format, packaging, native, ui]
    steps:
      - name: Install git
        run: dnf -y -q install git-core

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: tools/ci/check.sh deps ${{ matrix.stage }}

      - name: Check
        run: tools/ci/check.sh ${{ matrix.stage }}
