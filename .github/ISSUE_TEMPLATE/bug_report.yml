name: Bug report
description: Something in Zynith does not work as it should
labels: ["bug"]

body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed passwords, tokens and other private data from the logs I attach.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. …
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How Zynith is installed
      options:
        - Zynith ISO (Fedora-based)
        - RPM packages (packaging/rpm)
        - From source (deploy/install.sh)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Versions and hardware
      description: |
        The output of: `cat /usr/share/zynith/release 2>/dev/null || git describe --always`,
        `rpm -q niri quickshell`, `cat /etc/fedora-release`, and your GPU (`lspci -k | grep -A3 -E "VGA|3D"`).
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `zynith-ui log` (the UI), `journalctl --user -b | grep -i -E "zynith|niri"` (the shell and the
        compositor). For a crash: `coredumpctl info` for the crashed process.
      render: text
