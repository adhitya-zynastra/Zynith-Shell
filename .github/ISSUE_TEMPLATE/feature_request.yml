name: Feature request
description: Suggest an improvement to Zynith
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Mockups and references to other desktops are welcome.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Cost and alternatives
      description: Zynith counts idle CPU, wakeups and memory as features. Anything you know about what this would cost, or simpler alternatives.
